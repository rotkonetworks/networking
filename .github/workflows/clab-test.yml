name: clab config gate
on:
  pull_request:
    paths: [ 'generated/**', 'backup/mikrotik/**', 'deploy/**', 'clab/**' ]
  push:
    branches: [ main, master ]
    paths: [ 'generated/**', 'backup/mikrotik/**', 'deploy/**', 'clab/**' ]
  workflow_dispatch:
    inputs:
      full_convergence:
        description: "Run full containerlab convergence (needs self-hosted KVM runner + CHR image)"
        type: boolean
        default: false

jobs:
  lint:
    name: pre-deploy config gate
    runs-on: ubuntu-latest          # has docker; bird parse + bash -n + .rsc + yaml
    steps:
      - uses: actions/checkout@v4
      - name: validate all changed configs
        env:
          BIRD_IMG: ${{ vars.BIRD_IMG || 'ghcr.io/rotkonetworks/bird:3' }}
        run: ./clab/lint.sh

  convergence:
    name: containerlab convergence
    needs: lint
    if: ${{ github.event.inputs.full_convergence == 'true' }}
    runs-on: [ self-hosted, kvm ]   # needs containerlab + CHR image
    steps:
      - uses: actions/checkout@v4
      - name: deploy fabric + assert BGP
        env:
          ROS_IMAGE: ${{ vars.ROS_IMAGE }}
        run: ./clab/test.sh
