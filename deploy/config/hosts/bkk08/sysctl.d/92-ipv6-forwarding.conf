# IPv6 forwarding for guest containers — bkk06 / bkk07 / bkk08
#
# WHY THIS EXISTS (found 2026-08-18)
# All three hypervisors ran with:
#     net.ipv6.conf.all.forwarding = 0
#     net.ipv6.conf.default.forwarding = 0
#     (nothing persisted anywhere in /etc/sysctl.conf or /etc/sysctl.d/)
#
# Guests get an IPv6 default route pointing at the HOST bridge (e.g.
# 2401:a860:1008::1 on vmbr1). With forwarding off, a guest reaches its gateway
# and nothing beyond it:
#     CT 60807 -> 2401:a860:1008::1      0% loss, 0.07ms
#     CT 60807 -> 2606:4700:4700::1111   100% loss
#     bkk08    -> 2606:4700:4700::1111   0% loss, 25ms      (host itself is fine)
#
# This is WORSE than having no IPv6, because the route exists: clients resolve
# AAAA, attempt v6 first, stall, then fall back to v4. Cost depends on the client:
#   - curl / Go        happy-eyeballs, ~300ms penalty, looks "fine"
#   - python urllib    NO fallback — blocks the full timeout, per address
#   - node / ccxt      varies; observed 10s request timeouts
#
# Measured damage before the fix:
#   * flare-conditions-exporter hung FOREVER on raw.githubusercontent.com, which
#     returns 12 AAAA before any A. systemd showed the unit "active" while it
#     never bound its port. FIP.10 compliance was unmonitored as a result.
#   * www.xt.com resolves to 12 AAAA and ZERO A -> completely unreachable ->
#     LEO/USD lost its only unique price source and ran at 87.6% hit rate
#     (417 missed hits/epoch, 54% of ALL our FTSO misses).
#
# THE ACTUAL ROOT CAUSE — a Linux v4/v6 semantic difference, not a config typo
# Both stacks LOOK identically configured:
#     net.ipv4.ip_forward          = 0   net.ipv4.conf.vmbr1.forwarding = 1
#     net.ipv6.conf.all.forwarding = 0   net.ipv6.conf.vmbr1.forwarding = 1
# but only IPv4 works, because:
#   IPv4 decides forwarding PER INCOMING INTERFACE — conf.vmbr1.forwarding=1 is
#        sufficient, so guests route fine with the global knob at 0.
#   IPv6 requires the GLOBAL conf.all.forwarding=1. Its per-interface knob only
#        selects Host/Router behaviour (RA handling); it does NOT enable
#        forwarding. So the identical-looking setting silently does nothing.
# This is why guest IPv4 has always worked and guest IPv6 never has. Do not
# "fix" it by setting only the per-interface value — that is already 1.
#
# gw6 POINTING AT THE HOST IS CORRECT — do not re-point it
# BIRD runs ON these hypervisors and holds the fabric routes (bkk08: 726,977
# IPv6 routes, 726,948 proto bird — a full table; Cloudflare resolves via
# fd00:155:100::2 on vmbr2 with ECMP). The host genuinely IS the router for its
# guests, for both families: guest v4 gw = 10.8.0.1 and v6 gw =
# 2401:a860:1008::1 are both the host's vmbr1. The design is consistent; only
# the v6 forwarding switch was missing.
#
# SAFETY CHECK ALREADY DONE (do it again on any new host before applying)
# Enabling all.forwarding puts every interface into ROUTER mode, which stops
# accepting RAs. That would drop an RA-learned default route. Verified safe on
# bkk06/07/08: accept_ra=0 already and there is NO IPv6 default route to lose —
# reachability comes from BIRD's table, not from a default. On a host that DOES
# rely on RA, set net.ipv6.conf.<iface>.accept_ra=2 first or you will cut its
# own IPv6 off.
#
# APPLY: sysctl --system   (or reboot; this file makes it durable either way)
# VERIFY from any guest:  ping6 -c2 2606:4700:4700::1111
# VERIFY the latency tax is gone:
#   python3 -u -c 'import urllib.request,time;t=time.time();urllib.request.urlopen("https://raw.githubusercontent.com/flare-foundation/fsp-rewards/main/flare/424/passes.json",timeout=20);print("%.2fs"%(time.time()-t))'
#   healthy ~0.1s   broken: hangs

net.ipv6.conf.all.forwarding = 1
net.ipv6.conf.default.forwarding = 1
