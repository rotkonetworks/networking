# BIRD External BGP Templates for Option B Migration
# these templates will be included in each server's bird.conf
# IPs are placeholders - replace with actual BKNIX allocations

# =============================================================================
# COMMON DEFINITIONS
# =============================================================================

# our ASN
define LOCAL_AS = 142108;

# prefixes we announce
define OUR_PREFIX_V4 = 160.22.180.0/23;
define OUR_PREFIX_V6 = 2401:a860::/32;

# BKNIX route server ASN
define BKNIX_RS_AS = 63529;

# =============================================================================
# FILTERS
# =============================================================================

# bogon filter for imports
function is_bogon_v4() {
    return net ~ [
        0.0.0.0/8+,          # "this" network
        10.0.0.0/8+,         # RFC1918
        100.64.0.0/10+,      # CGN
        127.0.0.0/8+,        # loopback
        169.254.0.0/16+,     # link-local
        172.16.0.0/12+,      # RFC1918
        192.0.0.0/24+,       # IETF protocol
        192.0.2.0/24+,       # TEST-NET-1
        192.168.0.0/16+,     # RFC1918
        198.18.0.0/15+,      # benchmarking
        198.51.100.0/24+,    # TEST-NET-2
        203.0.113.0/24+,     # TEST-NET-3
        224.0.0.0/4+,        # multicast
        240.0.0.0/4+         # reserved
    ];
}

function is_bogon_v6() {
    return net ~ [
        ::/8+,               # loopback, unspecified, v4-mapped
        0100::/64+,          # discard
        2001::/32+,          # TEREDO
        2001:2::/48+,        # benchmarking
        2001:db8::/32+,      # documentation
        2002::/16+,          # 6to4 deprecated
        3ffe::/16+,          # 6bone deprecated
        fc00::/7+,           # ULA
        fe80::/10+,          # link-local
        ff00::/8+            # multicast
    ];
}

# filter for BKNIX imports
filter bknix_import_v4 {
    # reject bogons
    if is_bogon_v4() then reject;

    # reject our own prefix
    if net ~ [ 160.22.180.0/23+ ] then reject;

    # reject too small prefixes
    if net.len > 24 then reject;

    # reject default route
    if net = 0.0.0.0/0 then reject;

    # accept everything else
    accept;
}

filter bknix_import_v6 {
    # reject bogons
    if is_bogon_v6() then reject;

    # reject our own prefix
    if net ~ [ 2401:a860::/32+ ] then reject;

    # reject too small prefixes
    if net.len > 48 then reject;

    # reject default route
    if net = ::/0 then reject;

    accept;
}

# filter for BKNIX exports
filter bknix_export_v4 {
    # only announce our prefix
    if net = 160.22.180.0/23 then accept;
    reject;
}

filter bknix_export_v6 {
    # only announce our prefix
    if net = 2401:a860::/32 then accept;
    reject;
}

# HGC transit - similar but we accept default
filter hgc_import_v4 {
    if is_bogon_v4() then reject;
    if net ~ [ 160.22.180.0/23+ ] then reject;
    accept;
}

filter hgc_export_v4 {
    if net = 160.22.180.0/23 then accept;
    reject;
}

# =============================================================================
# BGP TEMPLATES
# =============================================================================

template bgp EBGP_COMMON {
    local as LOCAL_AS;
    hold time 30;
    keepalive time 10;
    graceful restart on;
    graceful restart time 120;
    long lived graceful restart on;

    ipv4 {
        import keep filtered;
        export all;
    };
}

template bgp EBGP_V6_COMMON {
    local as LOCAL_AS;
    hold time 30;
    keepalive time 10;
    graceful restart on;
    graceful restart time 120;
    long lived graceful restart on;

    ipv6 {
        import keep filtered;
        export all;
    };
}

# =============================================================================
# BKNIX SESSIONS (example for bkk06)
# =============================================================================
# replace BKNIX_LOCAL_IP with actual assigned IP

# BKNIX Route Server 0
protocol bgp BKNIX_RS0_v4 from EBGP_COMMON {
    description "BKNIX Route Server 0";
    neighbor 203.159.68.253 as 63529;
    source address BKNIX_LOCAL_IP4;  # e.g., 203.159.68.169

    ipv4 {
        import filter bknix_import_v4;
        export filter bknix_export_v4;
        add paths rx;
    };
}

protocol bgp BKNIX_RS1_v4 from EBGP_COMMON {
    description "BKNIX Route Server 1";
    neighbor 203.159.68.254 as 63529;
    source address BKNIX_LOCAL_IP4;

    ipv4 {
        import filter bknix_import_v4;
        export filter bknix_export_v4;
        add paths rx;
    };
}

# BKNIX Route Servers IPv6
protocol bgp BKNIX_RS0_v6 from EBGP_V6_COMMON {
    description "BKNIX Route Server 0 IPv6";
    neighbor 2001:df5:b881::253 as 63529;
    source address BKNIX_LOCAL_IP6;  # e.g., 2001:df5:b881::169

    ipv6 {
        import filter bknix_import_v6;
        export filter bknix_export_v6;
        add paths rx;
    };
}

protocol bgp BKNIX_RS1_v6 from EBGP_V6_COMMON {
    description "BKNIX Route Server 1 IPv6";
    neighbor 2001:df5:b881::254 as 63529;
    source address BKNIX_LOCAL_IP6;

    ipv6 {
        import filter bknix_import_v6;
        export filter bknix_export_v6;
        add paths rx;
    };
}

# Hurricane Electric via BKNIX
protocol bgp BKNIX_HE_v4 from EBGP_COMMON {
    description "Hurricane Electric via BKNIX";
    neighbor 203.159.69.33 as 6939;
    source address BKNIX_LOCAL_IP4;

    ipv4 {
        import filter bknix_import_v4;
        export filter bknix_export_v4;
    };
}

protocol bgp BKNIX_HE_v6 from EBGP_V6_COMMON {
    description "Hurricane Electric via BKNIX IPv6";
    neighbor 2001:df5:b881:0:6939::1 as 6939;
    source address BKNIX_LOCAL_IP6;

    ipv6 {
        import filter bknix_import_v6;
        export filter bknix_export_v6;
    };
}

# Cloudflare via BKNIX
protocol bgp BKNIX_CF_v4 from EBGP_COMMON {
    description "Cloudflare via BKNIX";
    neighbor 203.159.68.109 as 13335;
    source address BKNIX_LOCAL_IP4;

    ipv4 {
        import filter bknix_import_v4;
        export filter bknix_export_v4;
    };
}

# =============================================================================
# iBGP MESH (between bkk06/07/08)
# =============================================================================

template bgp IBGP_MESH {
    local as LOCAL_AS;
    direct;
    hold time 30;
    keepalive time 10;
    graceful restart on;

    ipv4 {
        next hop self;
        import all;
        export where source = RTS_BGP;
        add paths tx;  # RFC 7911 - send multiple paths
    };
}

# example for bkk06:
# protocol bgp iBGP_BKK07 from IBGP_MESH {
#     neighbor 10.155.100.7 as 142108;
# }
# protocol bgp iBGP_BKK08 from IBGP_MESH {
#     neighbor 10.155.100.8 as 142108;
# }

# =============================================================================
# KERNEL PROTOCOL WITH ECMP
# =============================================================================

protocol kernel kernel4 {
    ipv4 {
        export all;
        import none;
        merge paths on;  # ECMP - critical for load balancing
    };
    learn;
    persist;
    graceful restart on;
    scan time 10;
}

protocol kernel kernel6 {
    ipv6 {
        export all;
        import none;
        merge paths on;
    };
    learn;
    persist;
    graceful restart on;
    scan time 10;
}
