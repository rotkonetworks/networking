# new-DC fabric leaf — all-BIRD unnumbered eBGP (RFC 5549).
# PARSE-VERIFIED on bird 3.3.2 (2026-08). Proves BIRD needs no numbered host legs and no FRR:
# IPv4 rides the IPv6 link-local next-hop end to end via `extended next hop on`.
#
# This is the reference block for (a) the newdc clab and (b) the eBGP-unnumbered profile to add to
# ../../deploy/bird/gencfg.sh (alongside the existing iBGP-RR profile the current production fleet uses).
# Per-node values (router id, LOCAL_AS, anycast VIPs, fabric iface) come from network.json.
#
# Requirements: peer must also `extended next hop on`; IPv6 RA/ND on the link (link-local); kernel
# IPv4-route-via-IPv6-nexthop (Linux >=5.2 — hosts run 7.0.x). No addresses on the fabric interface.

log syslog all;
router id 10.155.181.81;                 # per-node unique v4 (mgmt/loopback)
define LOCAL_AS = 65181;                  # per-node private ASN

# send RAs on the fabric link so the FRR/RouterOS peer discovers our link-local for
# unnumbered interface peering. REQUIRED — without it the peer never initiates (session stays Idle).
# max ra interval must be 4..1800 (bird rejects <4).
protocol radv { interface "eth1" { max ra interval 4; }; }

protocol device { scan time 10; }
protocol direct { ipv4; ipv6; }   # picks up the anycast VIPs on lo

protocol kernel kernel4 { ipv4 { import none; export where source ~ [ RTS_BGP, RTS_STATIC ]; }; }
protocol kernel kernel6 { ipv6 { import none; export where source ~ [ RTS_BGP, RTS_STATIC ]; }; }

# originate this node's anycast VIPs (values per node from network.json)
protocol static anycast4 { ipv4; route 160.22.180.180/32 reject; }
protocol static anycast6 { ipv6; route 2401:a860::/128 reject; }

protocol bfd { interface "eth1" { min rx interval 100 ms; min tx interval 100 ms; multiplier 3; }; }

# unnumbered eBGP to spine/edge over IPv6 link-local; IPv4 via v6 next-hop (RFC 5549).
# `neighbor range` = dynamic link-local peers; bird binds each to its arrival interface
# (so one block accepts many leaves on a spine — no `%iface` and no per-neighbor addressing).
protocol bgp fabric {
    local as LOCAL_AS;
    neighbor range fe80::/64 external;
    direct;
    bfd on;
    ipv4 {
        extended next hop on;                                             # RFC 5549
        import filter { if net = 0.0.0.0/0 then accept; else reject; };   # default only
        # announce the anycast VIP by PREFIX — it lives on lo as a DIRECT route (pref 240),
        # which outranks a static, so `source = RTS_STATIC` would miss it. Match the prefix.
        export filter { if net = 160.22.180.180/32 then accept; else reject; };
    };
    ipv6 {
        import filter { if net = ::/0 then accept; else reject; };
        export filter { if net = 2401:a860::/128 then accept; else reject; };
    };
}
