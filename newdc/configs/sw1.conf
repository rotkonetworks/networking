! sw1 — AS65100 (unnumbered eBGP)
frr version 10.2.1
frr defaults traditional
hostname sw1
service integrated-vtysh-config
interface eth1
 no ipv6 nd suppress-ra
 ipv6 nd ra-interval 5
interface eth2
 no ipv6 nd suppress-ra
 ipv6 nd ra-interval 5
interface eth3
 no ipv6 nd suppress-ra
 ipv6 nd ra-interval 5
router bgp 65100
 bgp router-id 10.0.0.100
 no bgp default ipv4-unicast
 no bgp ebgp-requires-policy
 bgp bestpath as-path multipath-relax
 neighbor eth1 interface remote-as external
 neighbor eth1 timers 10 30
 neighbor eth1 bfd
 neighbor eth2 interface remote-as external
 neighbor eth2 timers 10 30
 neighbor eth2 bfd
 neighbor eth3 interface remote-as external
 neighbor eth3 timers 10 30
 neighbor eth3 bfd
 address-family ipv4 unicast
  neighbor eth1 activate
  neighbor eth2 activate
  neighbor eth3 activate
  maximum-paths 8
 exit-address-family
 address-family ipv6 unicast
  neighbor eth1 activate
  neighbor eth2 activate
  neighbor eth3 activate
  maximum-paths 8
 exit-address-family
exit
