# h2 — Proxmox host leaf, all-BIRD unnumbered eBGP (RFC 5549) against the FRR spine sw1.
log stderr all;
router id 10.255.0.111;
define LOCAL_AS = 65111;

protocol radv {
    interface "eth1" { max ra interval 4; };
}

protocol device { scan time 5; }
protocol direct { ipv4; ipv6; }

protocol kernel kernel4 { ipv4 { import none; export where source ~ [ RTS_BGP, RTS_STATIC ]; }; }
protocol kernel kernel6 { ipv6 { import none; export where source ~ [ RTS_BGP, RTS_STATIC ]; }; }

protocol static anycast4 { ipv4; route 203.0.113.11/32 reject; }
protocol static anycast6 { ipv6; route 2001:db8::11/128 reject; }

protocol bfd { interface "eth1" { min rx interval 100 ms; min tx interval 100 ms; multiplier 3; }; }

protocol bgp fabric {
    local as LOCAL_AS;
    neighbor range fe80::/64 external;
    direct;
    bfd on;
    ipv4 {
        extended next hop on;
        import filter { if net = 0.0.0.0/0 then accept; else reject; };
        export filter { if net = 203.0.113.11/32 then accept; else reject; };
    };
    ipv6 {
        import filter { if net = ::/0 then accept; else reject; };
        export filter { if net = 2001:db8::11/128 then accept; else reject; };
    };
}
