! transit1 — stub upstream AS64500 over the single cross-connect (NUMBERED)
frr version 10.2.1
frr defaults traditional
hostname transit1
service integrated-vtysh-config
!
ip route 198.51.100.0/24 blackhole
ipv6 route 2001:db8:aaaa::/48 blackhole
ip route 0.0.0.0/0 blackhole 254
ipv6 route ::/0 blackhole 254
!
router bgp 64500
 bgp router-id 10.0.0.2
 no bgp default ipv4-unicast
 neighbor 192.0.2.2 remote-as 142108
 neighbor 2001:db8:ff::2 remote-as 142108
 address-family ipv4 unicast
  network 0.0.0.0/0
  network 198.51.100.0/24
  neighbor 192.0.2.2 activate
  neighbor 192.0.2.2 default-originate
 exit-address-family
 address-family ipv6 unicast
  network ::/0
  network 2001:db8:aaaa::/48
  neighbor 2001:db8:ff::2 activate
  neighbor 2001:db8:ff::2 default-originate
 exit-address-family
exit
