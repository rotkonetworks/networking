! edge1 — new-DC single edge, AS142108 (public face)
! numbered transit UP (the one cross-connect) · unnumbered eBGP DOWN to the fabric
! LAB PREFIXES 203.0.113.0/24 + 2001:db8::/44 — swap to the assigned /24 + 2401:a860::/32.
! For production, port the full MANRS/RPKI/bogon hygiene from
! ../../../<repo>/configs/vyos/vyos1.conf (kept minimal here to validate the fabric).
frr version 10.2.1
frr defaults traditional
hostname edge1
service integrated-vtysh-config
!
ip prefix-list OWN-V4  seq 10 permit 203.0.113.0/24 le 24
ipv6 prefix-list OWN-V6 seq 10 permit 2001:db8::/44 le 48
!
! outbound to transit: ONLY our own space (never leak transit/fabric back up)
route-map TO-TRANSIT permit 10
 match ip address prefix-list OWN-V4
route-map TO-TRANSIT-V6 permit 10
 match ipv6 address prefix-list OWN-V6
route-map FROM-TRANSIT permit 10
route-map TO-FABRIC   permit 10
route-map FROM-FABRIC permit 10
!
ip route 203.0.113.0/24 blackhole 254
ipv6 route 2001:db8::/44 blackhole 254
!
interface eth2
 no ipv6 nd suppress-ra
 ipv6 nd ra-interval 5
!interface eth3          ! <- enable for edge2 iBGP when 2nd edge lands
! no ipv6 nd suppress-ra
! ipv6 nd ra-interval 5
!
router bgp 142108
 bgp router-id 10.0.0.11
 no bgp default ipv4-unicast
 bgp bestpath as-path multipath-relax
 bgp graceful-restart
 ! ---- transit (numbered) ----
 neighbor 192.0.2.1 remote-as 64500
 neighbor 192.0.2.1 local-role customer
 neighbor 192.0.2.1 ttl-security hops 1
 neighbor 2001:db8:ff::1 remote-as 64500
 neighbor 2001:db8:ff::1 local-role customer
 neighbor 2001:db8:ff::1 ttl-security hops 1
 ! ---- fabric: unnumbered eBGP down to sw1 (IPv6 LL + RFC5549) ----
 neighbor eth2 interface remote-as external
 neighbor eth2 timers 10 30
 neighbor eth2 timers connect 5
 neighbor eth2 bfd
 ! ---- edge2 iBGP (unnumbered) — additive redundancy, enable when it arrives ----
 ! neighbor eth3 interface remote-as 142108
 ! neighbor eth3 timers 10 30
 !
 address-family ipv4 unicast
  network 203.0.113.0/24
  neighbor 192.0.2.1 activate
  neighbor 192.0.2.1 route-map FROM-TRANSIT in
  neighbor 192.0.2.1 route-map TO-TRANSIT out
  neighbor eth2 activate
  neighbor eth2 route-map FROM-FABRIC in
  neighbor eth2 route-map TO-FABRIC out
  neighbor eth2 default-originate
  ! neighbor eth3 activate
  ! neighbor eth3 next-hop-self
  maximum-paths 4
 exit-address-family
 address-family ipv6 unicast
  network 2001:db8::/44
  neighbor 2001:db8:ff::1 activate
  neighbor 2001:db8:ff::1 route-map FROM-TRANSIT in
  neighbor 2001:db8:ff::1 route-map TO-TRANSIT-V6 out
  neighbor eth2 activate
  neighbor eth2 route-map FROM-FABRIC in
  neighbor eth2 route-map TO-FABRIC out
  neighbor eth2 default-originate
  ! neighbor eth3 activate
  ! neighbor eth3 next-hop-self
  maximum-paths 4
 exit-address-family
exit
