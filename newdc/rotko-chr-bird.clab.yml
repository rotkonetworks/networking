# High-fidelity interop test: BIRD host <-> real RouterOS (CHR) unnumbered eBGP + RFC 5549.
# The ACTUAL production pairing (bird on Proxmox hosts, RouterOS on the MikroTik edge/spine).
name: rotko-chr-bird
prefix: ""

topology:
  kinds:
    mikrotik_ros: { image: localhost/vrnetlab/mikrotik_routeros:7.23.1 }
    linux:        { image: localhost/clab-bird3:latest }

  nodes:
    chr1:                              # RouterOS spine (AS65100), unnumbered eBGP down to h1
      kind: mikrotik_ros
      startup-config: routeros/chr-spine-test.rsc

    h1:                                # BIRD 3.3.2 host leaf (AS65110)
      kind: linux
      binds: [ configs/h1.bird.conf:/etc/bird/bird.conf:ro ]
      exec:
        - sysctl -w net.ipv6.conf.all.forwarding=1
        - ip link set eth1 up
        - ip addr add 203.0.113.10/32 dev lo
        - ip -6 addr add 2001:db8::10/128 dev lo
        - mkdir -p /run/bird
        - bird -c /etc/bird/bird.conf

  links:
    - endpoints: [ "chr1:ether2", "h1:eth1" ]    # unnumbered (RouterOS nd prefix=none <-> bird radv)
