# bgpctl configuration for as142108
# copy to /etc/bgpctl/config.toml and adjust as needed

[daemon]
# how often to run the decision loop
decision_interval = "30s"
# how often to collect metrics from routers
collect_interval = "10s"
# log level (trace, debug, info, warn, error)
log_level = "info"
# run in dry-run mode (no changes applied)
dry_run = true

# edge routers (mikrotik routeros 7.x with REST API enabled)
[routers.bkk00]
address = "10.155.255.4"
port = 443
username = "bgpctl"
password_env = "BGPCTL_BKK00_PASSWORD"
tls = true
# source IP for probes through this router
probe_source_ip = "160.22.181.4"

[routers.bkk20]
address = "10.155.255.2"
port = 443
username = "bgpctl"
password_env = "BGPCTL_BKK20_PASSWORD"
tls = true
probe_source_ip = "160.22.181.2"

# peer configurations
# defines capacity, filter chains, and cost for each upstream

[peers.bknix]
router = "bkk00"
capacity_mbps = 10000  # 10G port at BKNIX
import_chain = "BKNIX-IN-v4"
export_chain = "BKNIX-OUT-v4"
interface = "sfp-sfpplus1"
is_transit = false
cost_factor = 0.5  # peering is cheap

[peers.hgc_hk]
router = "bkk00"
capacity_mbps = 800  # 800M HGC transit
import_chain = "HGC-HK-IN-v4"
export_chain = "HGC-HK-OUT-v4"
interface = "sfp-sfpplus2"
is_transit = true
cost_factor = 2.0  # transit is expensive

[peers.hgc_sg]
router = "bkk20"
capacity_mbps = 800  # 800M HGC transit
import_chain = "HGC-SG-IN-v4"
export_chain = "HGC-SG-OUT-v4"
interface = "sfp-sfpplus1"
is_transit = true
cost_factor = 2.0

[peers.amsix_eu]
router = "bkk00"
capacity_mbps = 100  # 100M at AMS-IX EU
import_chain = "AMSIX-IN-v4"
export_chain = "AMSIX-OUT-v4"
is_transit = false
cost_factor = 0.5

[peers.amsix_bkk]
router = "bkk20"
capacity_mbps = 1000  # 1G at AMS-IX BKK
import_chain = "AMSIX-BAN-IN-v4"
export_chain = "AMSIX-BAN-OUT-v4"
is_transit = false
cost_factor = 0.3  # local IX is cheapest

[peers.amsix_hk]
router = "bkk20"
capacity_mbps = 200  # 200M at AMS-IX HK
import_chain = "AMSIX-HK-IN-v4"
export_chain = "AMSIX-HK-OUT-v4"
is_transit = false
cost_factor = 0.5

# hurricane electric ipv6 transit - this is our main v6 transit!
[peers.he_v6]
router = "bkk00"
capacity_mbps = 10000  # via BKNIX 10G
import_chain = "HE-IN-v6"
export_chain = "HE-OUT-v6"
is_transit = true   # full ipv6 transit
cost_factor = 0.4   # free peering but still transit

# bknix ipv6 peering
[peers.bknix_v6]
router = "bkk00"
capacity_mbps = 10000  # 10G port
import_chain = "BKNIX-IN-v6"
export_chain = "BKNIX-OUT-v6"
is_transit = false
cost_factor = 0.5

[peers.cloudflare]
router = "bkk00"
capacity_mbps = 10000  # peering via BKNIX 10G
import_chain = "CLOUDFLARE-IN-v4"
export_chain = "CLOUDFLARE-OUT-v4"
is_transit = false
cost_factor = 0.3

# probe configuration
[probes]
# targets to probe for measuring path quality
targets = [
    "8.8.8.8",          # google dns
    "1.1.1.1",          # cloudflare
    "9.9.9.9",          # quad9
    "208.67.222.222",   # opendns
]
# probes per target per cycle
count = 5
# timeout per probe
timeout = "2s"
# interval between probe cycles
interval = "10s"

# scoring weights (must sum to 1.0)
[scoring.weights]
latency = 0.15      # how important is low latency
loss = 0.20         # how important is low packet loss
jitter = 0.10       # how important is low jitter
stability = 0.10    # how important is session stability
capacity = 0.35     # how important is available capacity (KEY for load balancing)
cost = 0.10         # how important is cost optimization

# baseline thresholds for scoring
[scoring.baselines]
max_acceptable_rtt = "150ms"
max_acceptable_loss = 0.02      # 2%
max_acceptable_jitter = "20ms"
stable_uptime = "24h"
congestion_threshold = 0.75     # 75% util triggers concern
critical_threshold = 0.90       # 90% util is critical

# hysteresis settings to prevent flapping
[hysteresis]
min_delta = 0.15                # minimum score change to trigger action
hold_time = "5m"                # minimum time between changes
stability_window = "10m"        # window for stability measurement

# capacity/load balancing settings
[capacity]
target_utilization = 0.70       # aim for 70% overall utilization
enable_load_balancing = true
max_ecmp_paths = 4              # max paths for ecmp
rebalance_threshold = 0.20      # rebalance if utilization differs by 20%

# prometheus metrics endpoint
[metrics]
listen = "0.0.0.0:9100"
path = "/metrics"
