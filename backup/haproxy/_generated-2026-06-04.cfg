#
# HAProxy configuration for IBP RPC nodes
# Generated: 2026-06-03T23:54:52Z
#

# Global settings
global
    log 127.0.0.1:514 local0 info  # Log more for monitoring
    chroot /var/lib/haproxy
    pidfile /var/run/haproxy.pid
    maxconn 500000
    user haproxy
    group haproxy
    daemon
    
    # Security hardening
    ssl-default-bind-ciphers ECDHE+AESGCM:ECDHE+CHACHA20:!PSK:!SRP:!DSS:!RC4:!3DES:!MD5
    ssl-default-bind-options no-sslv3 no-tlsv10 no-tlsv11 no-tls-tickets
    ssl-default-server-ciphers ECDHE+AESGCM:ECDHE+CHACHA20:!PSK:!SRP:!DSS:!RC4:!3DES:!MD5
    ssl-default-server-options no-sslv3 no-tlsv10 no-tlsv11 no-tls-tickets
    
    # Performance tuning for high throughput
    nbthread 16
    cpu-map auto:1/1-16 0-15
    tune.bufsize 131072
    tune.ssl.default-dh-param 2048
    tune.maxrewrite 16384
    tune.http.maxhdr 1000
    
    # Admin socket
    stats socket /var/run/haproxy.sock mode 660 level admin
    stats timeout 2m

# Defaults
defaults
    log global
    mode http
    option httplog
    option dontlognull    # Don't log null connections
    option log-health-checks
    
    # Timeouts (generous for RPC nodes)
    timeout connect 5s
    timeout client 300s   # Long for subscriptions
    timeout server 300s   # Long for heavy queries
    timeout http-request 60s
    timeout http-keep-alive 300s
    timeout queue 60s
    
    # WebSocket support
    timeout tunnel 3600s  # 1 hour for WS connections
    
    # Connection settings
    maxconn 250000
    retries 3
    option redispatch
    option http-server-close

# Stats - internal only
listen stats
    bind 127.0.0.1:8404
    stats enable
    stats uri /stats
    stats refresh 30s
    stats admin if TRUE

# HTTP Frontend - redirect only
frontend http-frontend
    bind 160.22.181.81:80,160.22.180.180:80,10.155.181.81:80,[2401:a860:1081::]:80,[2401:a860::]:80,[fd00:a860:1081::]:80
    mode http
    
    # Track requests for monitoring (no limiting)
    stick-table type ip size 1m expire 30s store http_req_rate(10s),http_req_cnt
    http-request track-sc0 src
    
    # Let's Encrypt ACME challenge
    acl letsencrypt-acl path_beg -i .well-known/acme-challenge/
    
    # Redirect to HTTPS
    http-request redirect scheme https code 301 if !letsencrypt-acl

    use_backend letsencrypt if letsencrypt-acl

# SSL Frontend
frontend ssl-frontend
    bind 160.22.181.81:443,160.22.180.180:443,10.155.181.81:443,[2401:a860:1081::]:443,[2401:a860::]:443,[fd00:a860:1081::]:443 ssl crt /etc/haproxy/certs/ibp crt /etc/haproxy/certs/rotko crt /etc/haproxy/certs alpn h2,http/1.1
    mode http
    
    # Security headers
    http-response set-header X-Frame-Options "DENY"
    http-response set-header X-Content-Type-Options "nosniff"
    http-response set-header X-XSS-Protection "1; mode=block"
    http-response set-header Referrer-Policy "no-referrer-when-downgrade"
    http-response set-header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload"
    
    # Remove server headers
    http-response del-header Server
    http-response del-header X-Powered-By
    
    # Track requests for monitoring/alerting (NO rate limiting)
    stick-table type ip size 10m expire 60s store http_req_rate(10s),http_req_cnt,bytes_out_rate(10s)
    http-request track-sc0 src
    
    # Log high-rate IPs for alerting (but don't block)
    http-request set-var(txn.req_rate) sc_http_req_rate(0)
    http-request capture var(txn.req_rate) len 10 if { var(txn.req_rate) -m int gt 1000 }
    
    # Compression
    compression algo gzip
    compression type text/html text/plain text/css application/json application/javascript
    
    # ACLs
    acl is_websocket hdr(Upgrade) -i websocket
    acl is_options method OPTIONS
    
    # CORS for public RPC — http-after-response (not http-response) so headers
    # are emitted on synthetic responses too (e.g. preflight 200 below).
    http-after-response set-header Access-Control-Allow-Origin "*"
    http-after-response set-header Access-Control-Allow-Methods "POST, GET, OPTIONS"
    http-after-response set-header Access-Control-Allow-Headers "Content-Type"
    http-after-response set-header Access-Control-Max-Age "86400"

    # CORS preflight
    http-request return status 200 if is_options
    
    # Let's Encrypt ACME challenge
    acl letsencrypt-acl path_beg -i .well-known/acme-challenge/
    use_backend letsencrypt if letsencrypt-acl
