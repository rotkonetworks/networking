# RPC Backends

backend polkadot-backend
    mode http
    balance leastconn
    
    # Health checks
    option httpchk
    http-check send meth POST uri / ver HTTP/1.1 hdr Host localhost hdr Content-Type application/json body "{\"jsonrpc\":\"2.0\",\"method\":\"system_health\",\"params\":[],\"id\":1}"
    http-check expect rstring "isSyncing.*false"
    
    # Retry and timeout
    retries 2
    option redispatch
    timeout server 30s
    
    # Servers
    server rpc-polkadot-rpc-polkadot-01-bkk06 10.6.111.10:9300 check inter 5s fall 3 rise 2 maxconn 10000
    server rpc-polkadot-rpc-polkadot-02-bkk07 10.7.112.10:9312 check inter 5s fall 3 rise 2 maxconn 10000
    server rpc-polkadot-rpc-polkadot-03-bkk08 10.8.113.10:9300 check inter 5s fall 3 rise 2 maxconn 10000

